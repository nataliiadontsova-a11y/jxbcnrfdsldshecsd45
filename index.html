<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweepy Cleaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: split stage — short story column left, a single phone "set" on the right where the whole show plays. Deliberately one dark look. */
:root{
  --ink:#0b0d19; --panel:#15192c; --text:#eef0ff; --muted:#8d93bb;
  --alarm:#ff3b5c; --warn:#ffd23f; --clean:#2ee59d; --straw:#eab04c; --wood:#8a4f2a;
  --glow:rgba(255,59,92,.28);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);overflow-x:hidden;margin:0}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60vmax 50vmax at 70% 50%,var(--glow),transparent 70%);transition:background 1.2s}
body[data-phase="3"],body[data-phase="4"]{--glow:rgba(46,229,157,.22)}
body[data-phase="2"]{--glow:rgba(255,210,63,.2)}

.wrap{position:relative;min-height:100%;box-sizing:border-box;padding-inline:16px;padding-block:32px;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:48px 72px}
.story{flex:0 1 340px;min-width:0;display:flex;flex-direction:column;gap:22px}
.brand{font:900 clamp(34px,5vw,54px)/1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand span{color:var(--clean)}
.lede{margin:0;color:var(--muted);font-size:16px;line-height:1.55;max-width:34ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;
  color:var(--muted);transition:background .4s,color .4s}
.steps b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid currentColor;
  font:800 13px/1 var(--f-display)}
.steps li.on{background:var(--panel);color:var(--text)}
.steps li.on[data-s="1"] b{color:var(--alarm)}
.steps li.on[data-s="2"] b{color:var(--warn)}
.steps li.on[data-s="3"] b{color:var(--clean)}
.steps li.on[data-s="4"] b{color:var(--clean);background:var(--clean);}
.steps li.on[data-s="4"] b::after{content:"";width:8px;height:14px;border:solid var(--ink);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.steps li.on[data-s="4"] b span{display:none}
.replay{align-self:flex-start;font:600 14px/1 var(--f-body);color:var(--text);background:transparent;border:1.5px solid var(--muted);
  border-radius:999px;padding:11px 18px;cursor:pointer}
.replay:hover{border-color:var(--text)}
.replay:focus-visible,.btn:focus-visible{outline:3px solid var(--warn);outline-offset:3px}

.stage{position:relative;overflow:hidden;padding:24px;flex:0 1 auto;max-width:100%;box-sizing:border-box}
.phone{position:relative;height:min(620px,80vh);aspect-ratio:300/620;max-width:100%;box-sizing:border-box;
  border-radius:13%/6.3%;background:#04050a;padding:3.4%;
  box-shadow:0 0 0 2px #2a2f4a,0 30px 80px rgba(0,0,0,.6),inset 0 0 0 2px #111}
.screen{position:relative;width:100%;height:100%;border-radius:11%/5.3%;overflow:hidden;container-type:size;
  background:#15102a;transition:background .6s}
.notch{position:absolute;top:1.6cqh;left:50%;width:30cqw;height:3.6cqh;transform:translateX(-50%);background:#04050a;border-radius:99px;z-index:9}
.sbar{position:absolute;top:1.9cqh;left:8cqw;right:8cqw;display:flex;justify-content:space-between;
  font:500 3.6cqw/1 var(--f-mono);color:var(--text);z-index:8}
.scan{position:absolute;top:10cqh;left:6cqw;right:6cqw;text-align:center;z-index:7;
  font:500 4.2cqw/1.35 var(--f-mono);color:var(--muted);min-height:2.7em}
.scan strong{display:block;font:800 7cqw/1.1 var(--f-display);color:var(--alarm);letter-spacing:-.01em}
body[data-phase="3"] .scan strong{color:var(--warn)}
body[data-phase="4"] .scan strong{color:var(--clean)}

/* infected flicker */
.screen.glitch{animation:flick 1.1s steps(1) infinite}
.screen.glitch::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px),
             linear-gradient(transparent 0 40%,rgba(255,59,92,.35) 40% 44%,transparent 44% 71%,rgba(255,255,255,.25) 71% 72.5%,transparent 72.5%);
  mix-blend-mode:screen;animation:bars .9s steps(1) infinite}
@keyframes flick{
  0%{background:#1a0c1d;filter:none} 8%{background:#7a0f28;filter:brightness(1.5)} 11%{background:#140a18;filter:none}
  34%{background:#240d22} 37%{background:#e8e8f5;filter:invert(1)} 39%{background:#1a0c1d;filter:none}
  62%{background:#5c0c20} 66%{background:#150a18} 83%{background:#9a1230;filter:brightness(1.3) hue-rotate(-20deg)} 86%{background:#1a0c1d;filter:none}
}
@keyframes bars{0%{transform:translateY(0)}25%{transform:translateY(-18%)}50%{transform:translateY(27%) scaleY(.6)}75%{transform:translateY(-4%)}}

.q{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none;
  font:900 82cqw/1 var(--f-display);color:var(--warn);-webkit-text-stroke:1.4cqw #1b0f18;
  text-shadow:2.4cqw 2.4cqw 0 var(--alarm);opacity:0;transform:scale(.2)}
.q.show{animation:qpop .5s cubic-bezier(.2,1.6,.4,1) forwards,qwob 1.1s .5s ease-in-out infinite}
.q.hide{animation:qout .35s ease-in forwards}
@keyframes qpop{to{opacity:1;transform:scale(1)}}
@keyframes qwob{0%,100%{opacity:1;transform:rotate(-6deg) scale(1)}50%{opacity:1;transform:rotate(7deg) scale(1.07)}}
@keyframes qout{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.6) rotate(20deg)}}

.sticker{position:absolute;width:22cqw;aspect-ratio:1;z-index:3;transform:scale(0);
  filter:drop-shadow(0 .8cqw .8cqw rgba(0,0,0,.45))}
.sticker svg{width:100%;height:100%;display:block}

.btn{position:absolute;left:50%;bottom:8cqh;z-index:7;transform:translate(-50%,40cqh);
  font:800 7.6cqw/1 var(--f-display);letter-spacing:.02em;color:#062a1b;background:var(--clean);
  border:0;border-radius:99px;padding:5cqw 15cqw;cursor:pointer;
  box-shadow:0 1.6cqw 0 #16915f,0 0 0 0 rgba(46,229,157,.6);transition:transform .55s cubic-bezier(.2,1.4,.4,1)}
.btn.show{transform:translate(-50%,0);animation:pulse 1.2s ease-out .5s infinite}
.btn.press{transform:translate(-50%,1.4cqw) scale(.94);box-shadow:0 .2cqw 0 #16915f;transition:transform .1s;animation:none}
@keyframes pulse{0%{box-shadow:0 1.6cqw 0 #16915f,0 0 0 0 rgba(46,229,157,.6)}100%{box-shadow:0 1.6cqw 0 #16915f,0 0 0 6cqw rgba(46,229,157,0)}}

.bar{position:absolute;left:12cqw;right:12cqw;bottom:11cqh;height:2.4cqw;border-radius:99px;background:rgba(255,255,255,.1);
  z-index:7;opacity:0;transition:opacity .3s}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--clean)}
.bar.show{opacity:1}

.broom{position:absolute;left:0;top:0;width:62cqw;z-index:6;pointer-events:none;opacity:0;transform-origin:30% 90%}
.broom svg{width:100%;display:block;filter:drop-shadow(0 1cqw 1cqw rgba(0,0,0,.4))}
.dust{position:absolute;width:2.4cqw;height:2.4cqw;border-radius:50%;background:#e9dcc2;z-index:5;pointer-events:none}

.done{position:absolute;inset:0;z-index:7;display:grid;place-content:center;justify-items:center;gap:5cqh;pointer-events:none}
.tick{width:56cqw;aspect-ratio:1;border-radius:50%;background:var(--clean);display:grid;place-items:center;
  box-shadow:0 0 0 4cqw rgba(46,229,157,.18),0 0 18cqw rgba(46,229,157,.5);transform:translateY(20cqh) scale(0);opacity:0}
.tick svg{width:62%}
.tick path{stroke-dasharray:100;stroke-dashoffset:100}
.done.show .tick{animation:rise .7s cubic-bezier(.2,1.5,.4,1) forwards}
.done.show .tick path{animation:draw .45s .45s ease-out forwards}
.done p{margin:0;font:800 7cqw/1.2 var(--f-display);text-align:center;opacity:0}
.done p small{display:block;font:500 4cqw/1.6 var(--f-mono);color:var(--muted)}
.done.show p{animation:fade .5s .7s forwards}
@keyframes rise{to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

.hand{position:absolute;left:0;top:0;width:34%;z-index:20;pointer-events:none;opacity:0}
.hand svg{width:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}

@media (prefers-reduced-motion:reduce){
  .screen.glitch{animation-duration:3s}
  .screen.glitch::after{animation:none}
  .q.show{animation:qpop .3s forwards}
  .btn.show{animation:none}
}
</style>
</head>
<body>

<div class="wrap">
  <section class="story">
    <h1 class="brand">Sweepy<span>.</span></h1>
    <p class="lede">Телефон підхопив віруси? Натисни Clean, і мітла змете всі наліпки з екрана.</p>
    <ol class="steps" id="steps">
      <li data-s="1"><b><span>1</span></b>Екран глючить, щось не так</li>
      <li data-s="2"><b><span>2</span></b>Натискаємо Clean</li>
      <li data-s="3"><b><span>3</span></b>Мітла змітає віруси</li>
      <li data-s="4"><b><span>4</span></b>Телефон чистий</li>
    </ol>
    <button class="replay" id="replay" type="button">Повторити анімацію</button>
  </section>

  <div class="stage">
    <div class="phone" id="phone">
      <div class="screen" id="screen">
        <div class="notch"></div>
        <div class="sbar"><span id="clock">9:41</span><span>5G ▮▮▮</span></div>
        <div class="scan" id="scan"></div>
        <div class="q" id="q">?</div>
        <button class="btn" id="btn" type="button">Clean</button>
        <div class="bar" id="bar"><i id="barFill"></i></div>
        <div class="done" id="done">
          <div class="tick"><svg viewBox="0 0 52 52" fill="none"><path d="M13 27 L22 36 L40 17" stroke="#062a1b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/></svg></div>
          <p>Phone is clean<small>0 threats · 1.4 GB freed</small></p>
        </div>
        <div class="broom" id="broom">
          <svg viewBox="-4 0 176 222" fill="none">
            <defs>
              <linearGradient id="bWood" x1="0" x2="1"><stop offset="0" stop-color="#5a2f15"/><stop offset=".3" stop-color="#c9864f"/><stop offset=".55" stop-color="#a5642f"/><stop offset="1" stop-color="#4f2811"/></linearGradient>
              <linearGradient id="bCap" x1="0" x2="1"><stop offset="0" stop-color="#9e1528"/><stop offset=".35" stop-color="#ff7384"/><stop offset="1" stop-color="#8a1022"/></linearGradient>
              <linearGradient id="bMetal" x1="0" x2="1"><stop offset="0" stop-color="#5c6474"/><stop offset=".3" stop-color="#f4f6fb"/><stop offset=".55" stop-color="#aab2c2"/><stop offset="1" stop-color="#4d5463"/></linearGradient>
              <linearGradient id="bBand" x1="0" x2="1"><stop offset="0" stop-color="#8f1024"/><stop offset=".38" stop-color="#ff5a6e"/><stop offset="1" stop-color="#7d0c1e"/></linearGradient>
              <linearGradient id="bStraw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a2f"/><stop offset=".35" stop-color="#f4cc70"/><stop offset="1" stop-color="#e3aa4a"/></linearGradient>
              <linearGradient id="bSide" x1="0" x2="1"><stop offset="0" stop-color="#3b2208" stop-opacity=".45"/><stop offset=".3" stop-color="#3b2208" stop-opacity="0"/><stop offset=".62" stop-color="#fff6d8" stop-opacity=".18"/><stop offset="1" stop-color="#3b2208" stop-opacity=".5"/></linearGradient>
            </defs>
            <g transform="translate(100 100) rotate(35.5)" stroke-linecap="round" stroke-linejoin="round">
              <!-- handle -->
              <rect x="-4.5" y="-112" width="9" height="102" rx="4.5" fill="url(#bWood)" stroke="#3b1f0e" stroke-width="1.6"/>
              <g stroke="#6e3a1a" stroke-opacity=".7" stroke-width=".8">
                <path d="M-1.6 -104 C-2.3 -96 -.6 -78 -1.9 -52 C-2.4 -36 -1 -24 -1.6 -14"/>
                <path d="M1.9 -100 C1.1 -88 2.6 -64 1.5 -40 C1.1 -30 2 -22 1.7 -16"/>
                <path d="M-3 -80 C-2.6 -70 -3.2 -62 -2.9 -56"/>
              </g>
              <ellipse cx=".4" cy="-66" rx="1.3" ry="3" fill="#5a2f15" stroke="none"/>
              <path d="M-2.4 -104 L-2.4 -20" stroke="#fff" stroke-opacity=".28" stroke-width="1.3"/>
              <!-- end cap with hanging hole -->
              <rect x="-5.6" y="-117" width="11.2" height="17" rx="3.2" fill="url(#bCap)" stroke="#5e0a18" stroke-width="1.6"/>
              <path d="M-5.2 -104.5 L5.2 -104.5" stroke="#5e0a18" stroke-width="1"/>
              <circle cx="0" cy="-111" r="1.7" fill="#3b0a12" stroke="none"/>
              <g transform="scale(1.35)">
              <!-- metal ferrule -->
              <rect x="-6.6" y="-15" width="13.2" height="15" rx="2" fill="url(#bMetal)" stroke="#3a404c" stroke-width="1.4"/>
              <path d="M-6.4 -10.5 L6.4 -10.5 M-6.4 -5 L6.4 -5" stroke="#5c6474" stroke-width=".9"/>
              <circle cx="3.4" cy="-7.7" r=".9" fill="#3a404c" stroke="none"/>
              <!-- bristles -->
              <path d="M-17 20 C-21 42 -28 62 -33 80 L33 80 C28 62 21 42 17 20 Z" fill="url(#bStraw)" stroke="#7a4e14" stroke-width="1.6"/>
              <g id="strands"></g>
              <path d="M-17 20 C-21 42 -28 62 -33 80 L33 80 C28 62 21 42 17 20 Z" fill="url(#bSide)" stroke="none"/>
              <!-- stitched tie across the bristles -->
              <path d="M-20 36 Q0 40.5 20 36" stroke="#b01a31" stroke-width="2.6"/>
              <path d="M-19.5 36 Q0 40.5 19.5 36" stroke="#ffd0d6" stroke-width=".7" stroke-dasharray="1.6 2.2"/>
              <!-- binding head -->
              <path d="M-9 -1 L9 -1 L17.5 21.5 L-17.5 21.5 Z" fill="url(#bBand)" stroke="#5e0a18" stroke-width="1.6"/>
              <path d="M-10.5 5 L10.5 5 M-14.6 15 L14.6 15" stroke="#fff" stroke-opacity=".85" stroke-width=".8" stroke-dasharray="1.8 1.8"/>
              <path d="M-12.2 10 L12.2 10" stroke="#5e0a18" stroke-opacity=".5" stroke-width="1"/>
              <path d="M-6 1.5 L-12.5 19" stroke="#fff" stroke-opacity=".3" stroke-width="1.6"/>
              </g>
            </g>
          </svg>
        </div>
      </div>
      <div class="hand" id="hand">
        <svg viewBox="0 0 100 124">
          <g fill="#ffc9a3">
            <rect x="26" y="50" width="64" height="54" rx="20"/>
            <rect x="48" y="44" width="18" height="30" rx="9"/>
            <rect x="63" y="47" width="17" height="28" rx="8.5"/>
            <rect x="76" y="52" width="15" height="26" rx="7.5"/>
            <rect x="28" y="2" width="22" height="66" rx="11"/>
            <path d="M28 66 C14 62 8 72 14 80 L30 94"/>
          </g>
          <rect x="34" y="100" width="52" height="20" rx="5" fill="#5b6cff"/>
          <path d="M33 16 q6 -6 12 0" stroke="#fff" stroke-opacity=".6" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const screen = $('screen'), phone = $('phone'), q = $('q'), btn = $('btn'), hand = $('hand'),
        broom = $('broom'), bar = $('bar'), barFill = $('barFill'), done = $('done'), scan = $('scan');

  // clock
  const tickClock = () => { const d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); };
  tickClock(); setInterval(tickClock, 30000);

  // virus sticker art
  const face = ['angry','grin','sly'];
  function virusSVG(color, dark, kind){
    let spikes = '';
    for (let i = 0; i < 9; i++){
      const a = i / 9 * Math.PI * 2, x1 = 50 + Math.cos(a)*24, y1 = 50 + Math.sin(a)*24, x2 = 50 + Math.cos(a)*36, y2 = 50 + Math.sin(a)*36;
      spikes += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${dark}" stroke-width="5" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="5" fill="${color}" stroke="${dark}" stroke-width="3"/>`;
    }
    const brows = kind === 'angry' ? `<path d="M34 38 L46 43 M66 38 L54 43" stroke="${dark}" stroke-width="3.5" stroke-linecap="round"/>` : '';
    const mouth = kind === 'grin'
      ? `<path d="M39 58 Q50 70 61 58 Z" fill="#fff" stroke="${dark}" stroke-width="3" stroke-linejoin="round"/>`
      : kind === 'sly' ? `<path d="M40 61 Q52 56 61 62" stroke="${dark}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
      : `<path d="M40 63 L44 59 L48 63 L52 59 L56 63 L60 59" stroke="${dark}" stroke-width="3" fill="none" stroke-linejoin="round"/>`;
    return `<svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="#fff"/>
      <circle cx="50" cy="50" r="44" fill="#fff" stroke="#e3e5f0" stroke-width="2"/>
      ${spikes}
      <circle cx="50" cy="50" r="25" fill="${color}" stroke="${dark}" stroke-width="4"/>
      <circle cx="42" cy="48" r="6" fill="#fff"/><circle cx="58" cy="48" r="6" fill="#fff"/>
      <circle cx="43" cy="49" r="3" fill="${dark}"/><circle cx="57" cy="49" r="3" fill="${dark}"/>
      ${brows}${mouth}
    </svg>`;
  }
  const palette = [['#ff4d6d','#5a0f1f'],['#9b5de5','#2c1150'],['#ff8c42','#5a2a08'],['#f15bb5','#541036'],['#c3e636','#344208'],['#4cc9f0','#0b3a4a']];
  // [left%, top%, rotation, scale] grouped in 3 sweep rows
  const layout = [
    [4,26,-14,1],[38,22,10,.9],[70,27,-6,1.05],
    [10,46,8,.95],[44,50,-18,1.1],[73,45,14,.85],
    [2,66,-8,1.05],[36,70,16,.9],[68,65,-12,1]
  ];
  const names = ['Trojan.Sticker','Adware.Popup','Worm.Glue','Spy.Peeker','Miner.Hot','Ransom.Tape','Bot.Spam','Rootkit.Goo','Keylog.Tap'];
  // broom straw strands (seeded so the broom looks the same every load)
  (() => {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const cols = ['#b87a26','#f7d98a','#d69a3c','#9a6520','#ffe7a8','#c98a2f'];
    let out = '';
    for (let i = 0; i < 64; i++){
      const t = (i / 63) * 2 - 1 + (rnd() - .5) * .08;
      const x0 = t * 15.5, y0 = 22 + rnd() * 3;
      const stray = rnd() < .1;
      const x1 = t * (stray ? 36 : 31) + (rnd() - .5) * 3, y1 = 77 + rnd() * (stray ? 11 : 6);
      const cx = (x0 + x1) / 2 + (rnd() - .5) * 4, cy = (y0 + y1) / 2;
      out += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${cols[Math.floor(rnd()*cols.length)]}" stroke-width="${(.6 + rnd()*.8).toFixed(2)}" fill="none" stroke-linecap="round"/>`;
    }
    document.getElementById('strands').innerHTML = out;
  })();

  const stickers = layout.map((p, i) => {
    const el = document.createElement('div');
    el.className = 'sticker';
    const [c, d] = palette[i % palette.length];
    el.innerHTML = virusSVG(c, d, face[i % 3] === 'angry' && i % 2 ? 'teeth' : face[i % 3]);
    el.style.left = p[0] + 'cqw'; el.style.top = p[1] + 'cqh';
    el.dataset.rot = p[2]; el.dataset.s = p[3]; el.dataset.row = Math.floor(i / 3);
    screen.insertBefore(el, q);
    return el;
  });

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let run = 0, clickResolve = null;
  btn.addEventListener('click', () => { if (clickResolve) clickResolve('user'); });
  $('replay').addEventListener('click', play);

  function setPhase(n){
    document.body.dataset.phase = n;
    document.querySelectorAll('#steps li').forEach(li => li.classList.toggle('on', +li.dataset.s === n));
  }
  function say(big, small){ scan.innerHTML = `<strong>${big}</strong>${small || ''}`; }
  function rel(el){ const a = el.getBoundingClientRect(), b = screen.getBoundingClientRect(); return {x:a.left-b.left, y:a.top-b.top, w:a.width, h:a.height}; }

  function reset(){
    document.querySelectorAll('.dust').forEach(d => d.remove());
    [hand, broom, ...stickers].forEach(el => el.getAnimations().forEach(a => a.cancel()));
    stickers.forEach(s => { s.style.transform = 'scale(0)'; s.style.opacity = 1; });
    screen.classList.remove('glitch');
    q.className = 'q'; btn.className = 'btn'; done.className = 'done'; bar.className = 'bar';
    barFill.style.width = '0%';
    hand.style.opacity = 0; broom.style.opacity = 0;
    scan.innerHTML = '';
  }

  function popSticker(s){
    const r = s.dataset.rot, k = s.dataset.s;
    s.animate([{transform:`scale(0) rotate(${r-40}deg)`},{transform:`scale(${k*1.25}) rotate(${+r+6}deg)`},{transform:`scale(${k}) rotate(${r}deg)`}],
      {duration:380, easing:'cubic-bezier(.2,1.4,.4,1)', fill:'forwards'});
  }
  function sweepSticker(s){
    const r = +s.dataset.rot, k = +s.dataset.s, dx = 90 + Math.random()*80, dy = -40 - Math.random()*90;
    s.animate([
      {transform:`scale(${k}) rotate(${r}deg)`, opacity:1},
      {transform:`translate(10px,-6px) scale(${k*1.15}) rotate(${r+20}deg)`, opacity:1, offset:.2},
      {transform:`translate(${dx}px,${dy}px) scale(${k*.3}) rotate(${r+260}deg)`, opacity:0}
    ], {duration:620, easing:'cubic-bezier(.4,0,.8,.6)', fill:'forwards'});
    const p = rel(s);
    for (let i = 0; i < 7; i++){
      const d = document.createElement('div'); d.className = 'dust';
      d.style.left = (p.x + p.w/2) + 'px'; d.style.top = (p.y + p.h*.7) + 'px';
      screen.appendChild(d);
      const a = Math.random()*Math.PI - Math.PI, dist = 20 + Math.random()*40;
      d.animate([{transform:'scale(1)', opacity:.9},{transform:`translate(${Math.cos(a)*dist+30}px,${Math.sin(a)*dist}px) scale(.2)`, opacity:0}],
        {duration:600 + Math.random()*300, easing:'ease-out', fill:'forwards'}).onfinish = () => d.remove();
    }
  }

  async function handPress(alive){
    const ph = phone.getBoundingClientRect(), b = btn.getBoundingClientRect();
    const hw = hand.offsetWidth, hh = hw * 1.24;
    const tx = b.left - ph.left + b.width*.55 - hw*.39, ty = b.top - ph.top + b.height*.45 - hh*.03;
    const sx = ph.width*.78, sy = ph.height*1.02;
    hand.style.opacity = 1;
    const move = hand.animate([
      {transform:`translate(${sx}px,${sy}px) rotate(18deg)`},
      {transform:`translate(${tx+14}px,${ty+26}px) rotate(-6deg)`, offset:.8},
      {transform:`translate(${tx}px,${ty}px) rotate(-8deg)`}
    ], {duration:900, easing:'cubic-bezier(.3,.8,.3,1)', fill:'forwards'});
    await move.finished.catch(()=>{});
    if (!alive()) return;
    await sleep(220);
    const press = hand.animate([
      {transform:`translate(${tx}px,${ty}px) rotate(-8deg) scale(1)`},
      {transform:`translate(${tx}px,${ty+8}px) rotate(-8deg) scale(.9)`},
      {transform:`translate(${tx}px,${ty}px) rotate(-8deg) scale(1)`}
    ], {duration:360, easing:'ease-in-out', fill:'forwards'});
    await sleep(140);
    if (clickResolve) clickResolve('hand');
    await press.finished.catch(()=>{});
  }

  async function sweepRow(row, alive, onHit){
    const sw = screen.clientWidth, bw = broom.offsetWidth, bh = bw * 222/176;
    const inRow = stickers.filter(s => +s.dataset.row === row);
    const rowBottom = Math.max(...inRow.map(s => { const p = rel(s); return p.y + p.h; }));
    const top = rowBottom - bh*.9;
    const x0 = -bw*.9, x1 = sw + bw*.1, D = 1150;
    broom.style.opacity = 1;
    broom.animate([
      {transform:`translate(${x0}px,${top}px) rotate(-14deg)`},
      {transform:`translate(${x0+(x1-x0)*.25}px,${top+6}px) rotate(6deg)`},
      {transform:`translate(${x0+(x1-x0)*.5}px,${top}px) rotate(-10deg)`},
      {transform:`translate(${x0+(x1-x0)*.75}px,${top+6}px) rotate(6deg)`},
      {transform:`translate(${x1}px,${top}px) rotate(-14deg)`}
    ], {duration:D, easing:'linear', fill:'forwards'});
    const tipOffset = bw * .35;
    inRow.forEach(s => {
      const p = rel(s), hitX = p.x + p.w*.2;
      const t = Math.max(0, (hitX - tipOffset - x0) / (x1 - x0)) * D;
      setTimeout(() => { if (alive()){ sweepSticker(s); onHit(s); } }, t);
    });
    await sleep(D);
  }

  async function play(){
    const id = ++run, alive = () => id === run;
    clickResolve = null;
    reset();
    await sleep(350); if (!alive()) return;

    // 1 — infected
    setPhase(1);
    screen.classList.add('glitch');
    say('System error', 'something is wrong');
    await sleep(900); if (!alive()) return;
    q.classList.add('show');
    await sleep(1700); if (!alive()) return;

    // 2 — press Clean
    setPhase(2);
    btn.classList.add('show');
    const clicked = new Promise(r => { clickResolve = r; });
    await sleep(750); if (!alive()) return;
    handPress(alive);
    const who = await clicked; if (!alive()) return;
    clickResolve = null;
    btn.classList.remove('show'); btn.classList.add('press');
    if (who === 'user') hand.style.opacity = 0;
    await sleep(260); if (!alive()) return;

    // 3 — sweep
    setPhase(3);
    screen.classList.remove('glitch');
    q.className = 'q hide';
    btn.className = 'btn';
    hand.getAnimations().forEach(a => a.cancel()); hand.style.opacity = 0;
    say(`${stickers.length} threats found`, 'preparing cleanup');
    for (const st of stickers){ popSticker(st); await sleep(90); if (!alive()) return; }
    await sleep(500); if (!alive()) return;
    bar.classList.add('show');
    let removed = 0;
    say('Cleaning…', 'removing ' + names[0]);
    const onHit = s => {
      removed++;
      barFill.style.transition = 'width .3s'; barFill.style.width = (removed / stickers.length * 100) + '%';
      say(`Cleaning… ${removed}/${stickers.length}`, 'removed ' + names[stickers.indexOf(s)]);
    };
    for (let row = 0; row < 3; row++){
      await sweepRow(row, alive, onHit); if (!alive()) return;
    }
    broom.style.opacity = 0;
    await sleep(250); if (!alive()) return;

    // 4 — clean
    setPhase(4);
    bar.className = 'bar';
    scan.innerHTML = '';
    done.classList.add('show');
    await sleep(5200); if (!alive()) return;
    play();
  }

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
})();
</script>
